homeIntroText=Engagierter ABAP-Entwickler, der gerne \u00fcber den SAP-Rand hinausblickt um neues zu lernen und entdecken.
homeAboutText=Hey! Mein Name ist Marco und dies ist eine Demo-Seite, auf der ich einige UI5/WebDev-spezifische Dinge teste. Hier und da gibt es ein paar Informationen \u00fcber mich. Um mehr zu erfahren, folge mir einfach auf einen der verlinkten socials.\n\n Jegliche Art von Feedback ist willkommen. Gestartet als ABAP Entwickler sehe ich mich mittlerweile als Full-Stack Entwickler. Aktuell befinde ich mich in der Rolle eines UI5 Architect. Auch interessieren mich andere Themen wie: RAP, CAP (bzw. alles rund um die Cloud/BTP), CDS, OData uvm. \n\n M\u00fcsste ich mich in einem Satz beschreiben w\u00e4re das wohl: 'Jack of all trades, master of none'.
